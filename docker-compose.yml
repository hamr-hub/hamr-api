services:
  api-gateway:
    build: .
    container_name: hamr-api-gateway
    restart: unless-stopped
    # Graceful shutdown (iter-skill 2026-09-01 round-5): the gateway
    # traps SIGTERM and drains in-flight requests before exiting.
    # `stop_grace_period` is Docker's analog of Kubernetes'
    # `terminationGracePeriodSeconds`: how long docker-compose waits
    # between sending SIGTERM and SIGKILL. 30s matches the round-5
    # k8s recommendation and is comfortably above any plausible
    # in-flight request budget for this proxy.
    stop_grace_period: 30s
    environment:
      PORT: ${PORT:-8090}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ACCOUNT_SERVICE_URL: ${ACCOUNT_SERVICE_URL:-http://hamr-account-api:3001}
      APP_SERVICE_URL: ${APP_SERVICE_URL:-http://hamr-app-api:3002}
      JIABU_SERVICE_URL: ${JIABU_SERVICE_URL:-http://hamr-jiabu-api:3003}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "8090:8090"
